<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Markdown メモ帳</title>
  <link rel="stylesheet" href="assets/style.css">
  <script type="module" src="src/ui/main.js"></script>
</head>
<body>
  <div id="app" data-view="edit">
    <header id="toolbar">
      <h1 id="app-title">Markdown メモ帳</h1>
      <button id="btn-new" type="button" aria-label="新規メモ (Ctrl/Cmd+N)">新規</button>
      <button id="btn-delete" type="button" aria-label="削除 (このメモ)">削除</button>
      <button id="btn-export" type="button" aria-label="書き出し (JSON)">書き出し</button>
      <button id="btn-import" type="button" aria-label="読み込み (JSON)">読み込み</button>
      <input id="import-file" type="file" accept="application/json,.json" hidden>
      <span id="save-status"></span>
      <span id="live-region" class="sr-only" role="status"></span>
    </header>
    <div id="error-banner" role="alert" hidden>
      <span id="error-text"></span>
      <button id="error-close" type="button" aria-label="エラーを閉じる">×</button>
    </div>
    <aside id="sidebar" aria-label="メモ一覧">
      <input id="search" type="search" placeholder="検索 (Ctrl/Cmd+K)" aria-label="メモを検索">
      <div id="tag-filter" role="group" aria-label="タグで絞り込み"></div>
      <ul id="note-list"></ul>
      <p id="empty-message" hidden>メモがありません</p>
    </aside>
    <main id="workspace">
      <div id="tabs" role="tablist" aria-label="表示切り替え">
        <button id="tab-edit" type="button" role="tab" aria-selected="true" aria-controls="editor-panel" tabindex="0">編集</button>
        <button id="tab-preview" type="button" role="tab" aria-selected="false" aria-controls="preview" tabindex="-1">プレビュー</button>
      </div>
      <div id="editor-panel" role="tabpanel" aria-labelledby="tab-edit">
        <textarea id="editor" aria-label="Markdown 本文" spellcheck="false"></textarea>
      </div>
      <article id="preview" role="tabpanel" aria-labelledby="tab-preview" tabindex="0"></article>
    </main>
    <dialog id="import-dialog" aria-labelledby="import-title">
      <h2 id="import-title">メモを読み込む</h2>
      <p id="import-summary"></p>
      <button id="import-merge" type="button">統合 (merge)</button>
      <button id="import-replace" type="button">上書き (replace)</button>
      <button id="import-cancel" type="button">キャンセル</button>
    </dialog>
  </div>
</body>
</html>
